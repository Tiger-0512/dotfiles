# Managed by chezmoi. Agent integrations are installed separately because
# they update each agent's own configuration files.
onboarding = false

[update]
# Herdr itself is pinned and updated through the Nix flake.
version_check = false

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.sidebar.agents]
# Show the agent-provided terminal title without a leading spinner glyph.
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
  [{ token = "terminal_title_stripped", dim = true }],
]

[ui.toast]
# Notify even when no Herdr terminal client is attached.
delivery = "system"
delay_seconds = 1

[keys]
# Herdr requires a prefix key, so park it on an otherwise unused key and use
# direct bindings for the normal tab and pane workflow.
prefix = "f24"
detach = "ctrl+esc"
new_tab = "ctrl+t"
previous_tab = "ctrl+shift+h"
next_tab = "ctrl+shift+l"
# Spaces (workspaces) are stacked vertically in the sidebar, so "up" is the
# previous one and "down" is the next one.
previous_workspace = "ctrl+shift+k"
next_workspace = "ctrl+shift+j"
new_workspace = "ctrl+s"
focus_pane_left = "ctrl+n"
focus_pane_down = "ctrl+m"
focus_pane_up = "ctrl+comma"
focus_pane_right = "ctrl+period"
split_horizontal = "ctrl+semicolon"
split_vertical = "ctrl+quote"
resize_mode = "ctrl+shift+r"
copy_mode = "ctrl+shift+y"

# Herdr has no built-in "focus the agent that is waiting for me" action; the
# only agent bindings are previous_agent / next_agent and the indexed
# focus_agent. Resolve the target over the socket API instead.
[[keys.command]]
key = "ctrl+a"
type = "shell"
description = "Focus the next agent waiting for the user"
command = "~/.config/herdr/focus-waiting-agent.sh"

[session]
resume_agents_on_restore = true

[experimental]
# Render Yazi image and PDF previews through WezTerm's Kitty graphics support.
kitty_graphics = true

# Keep terminal output that may contain prompts or secrets off disk.
pane_history = false

# Keep the native macOS IME candidate window aligned with agent TUIs.
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex", "kiro"]
switch_ascii_input_source_in_prefix = true
